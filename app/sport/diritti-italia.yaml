    chiaro: false
    accesso: diretta
  - nome: Nove
    cosa: semifinali e finali, ma solo se ci sono italiani in gara
    chiaro: true
    accesso: chiaro
  spiegazione: 'Se cercavi l''Australian Open su Sky non lo troverai: lo Slam australiano è passato a
    Eurosport in esclusiva. È il cambio che spiazza più persone, perché per anni è stato su Sky. Oggi
    Eurosport si raggiunge da più strade, e se hai già DAZN o TIMVISION ce l''hai incluso senza pagare
    altro.'
  nota: 'Il chiaro su Nove è una SCELTA COMMERCIALE di Discovery, non un obbligo: l''AGCOM ha inserito
    semifinali e finali fra gli eventi di interesse pubblico, ma l''obbligo scatta solo dal prossimo ciclo,
    dopo la scadenza del contratto nel 2031. Nel 2026 è andata così; per l''edizione successiva va RIVERIFICATO
    e non dato per scontato. Eurosport incluso per abbonati DAZN/TIMVISION è il punto commercialmente
    più importante del file.'
  faq:
  - d: L'Australian Open si vede su Sky?
    r: No. Dal 2026 è su Eurosport in esclusiva, quindi su Discovery+, HBO Max o tramite i canali Eurosport
      inclusi in DAZN e TIMVISION.
  - d: Si vede qualcosa in chiaro?
    r: 'Su Nove, ma solo semifinali e finali e solo se ci sono italiani in gara. È una scelta dell''emittente,
      non un obbligo di legge: non darla per scontata.'
  - d: Ho già DAZN, devo pagare altro?
    r: No. Il canale Eurosport è compreso nell'abbonamento DAZN, come in quello TIMVISION.
  fonti:
  - https://it.wikipedia.org/wiki/Australian_Open
  - https://www.eurosport.it/
